services:
  postgres:
    image: postgres:16-alpine
    container_name: linguaai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-linguaai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-linguaai}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # $$ keeps the value from the container environment: never interpolate
      # credentials into the probe command (visible via docker inspect).
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - linguaai-net

  redis:
    image: redis:7-alpine
    container_name: linguaai-redis
    restart: unless-stopped
    # The password must not appear in argv (docker inspect/ps expose it).
    # The entrypoint writes an ACL file in tmpfs from the runtime environment,
    # then starts redis-server with only the file path as an argument.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        install -d -m 0700 -o redis -g redis /run/redis
        umask 077
        printf 'user default on >%s ~* +@all\n' "$$REDIS_PASSWORD" > /run/redis/acl.conf
        chown redis:redis /run/redis/acl.conf
        exec gosu redis redis-server --aclfile /run/redis/acl.conf --appendonly yes
    tmpfs:
      - /run/redis:uid=999,gid=1000,mode=0700
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      # REDISCLI_AUTH is read by redis-cli itself: no password on the command
      # line and no "Warning: using a password with '-a'" in container logs.
      # The value is injected at container runtime, so '$$' keeps Compose from
      # interpolating it from the deploy host's shell.
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - linguaai-net

  # One-shot job: the ONLY place that applies schema migrations. API replicas
  # must never run `prisma migrate deploy` concurrently on a fresh database.
  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: linguaai-migrate
    restart: "no"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-linguaai}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-linguaai}
    entrypoint: ["sh", "-c"]
    command: ["node_modules/.bin/prisma migrate deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - linguaai-net
    deploy:
      resources:
        limits:
          memory: 512M

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: linguaai-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-linguaai}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-linguaai}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?MFA_ENCRYPTION_KEY must be set}
      AI_SERVICE_URL: http://ai:8000
      AI_SERVICE_API_KEYS: ${AI_SERVICE_API_KEYS:?AI_SERVICE_API_KEYS must be set}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      PASSWORD_HISTORY_LIMIT: ${PASSWORD_HISTORY_LIMIT:-5}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      # Browser-facing origin (no /api/v1 suffix): the API returns absolute
      # upload URLs from this value, so it must be reachable by clients.
      API_URL: ${API_URL:?API_URL must be set to the public API origin}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    volumes:
      # StorageAdapter writes to <cwd>/uploads (see Dockerfile.api WORKDIR).
      # The image must pre-create this directory owned by the runtime user.
      - uploads_data:/app/apps/api/uploads
    healthcheck:
      # Liveness only: a 200 here means the process is alive, not that
      # dependencies are healthy. Readiness is checked at /api/health/ready.
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - linguaai-net
    deploy:
      resources:
        limits:
          memory: 512M

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        # Baked into the browser bundle at build time; runtime env cannot
        # change it. Require an explicit public origin instead of localhost.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL must be set to the browser-reachable API base URL}
    container_name: linguaai-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Browser-side requests (build-time inlined into the client bundle).
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL must be set to the browser-reachable API base URL}
      # Server-side Next.js routes run inside this container: they must reach
      # the API over the compose network, never via a browser-facing hostname.
      # Keep these names aligned with the web route changes in OPS-01.
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://api:3001/api/v1}
      CMS_BACKEND_URL: ${CMS_BACKEND_URL:-http://api:3001/api/v1}
      # Temporary minimum until web AI routes move behind the API/AI service:
      # provider secrets are server-only and are never NEXT_PUBLIC_*.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - linguaai-net
    deploy:
      resources:
        limits:
          memory: 512M

  ai:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ai
    container_name: linguaai-ai
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: production
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      GROQ_API_KEY: ${GROQ_API_KEY:?GROQ_API_KEY must be set}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      AI_SERVICE_API_KEYS: ${AI_SERVICE_API_KEYS:?AI_SERVICE_API_KEYS must be set}
    healthcheck:
      # Liveness only: /ready calls external providers and can consume quota;
      # /health is cheap and local. Never use readiness as a restart gate.
      test: ["CMD-SHELL", "python -c 'import sys, urllib.request; sys.exit(0 if urllib.request.urlopen(\"http://127.0.0.1:8000/health\", timeout=3).status == 200 else 1)' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # FastAPI /health does not check Redis itself; keep the dependency on
    # Redis health so a stopped cache does not silently break AI features.
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - linguaai-net
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  postgres_data:
  redis_data:
  uploads_data:

networks:
  linguaai-net:
    driver: bridge
