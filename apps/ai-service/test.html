<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinguaAI – Groq Chat Test</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f0f13;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }
    header h1 { font-size: 1.6rem; color: #f8fafc; }
    header p  { font-size: 0.85rem; color: #64748b; margin-top: 4px; }

    .badge {
      display: inline-block;
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 999px;
      padding: 3px 12px;
      font-size: 0.75rem;
      color: #7dd3fc;
      margin-top: 8px;
    }

    .chat-window {
      width: 100%;
      max-width: 720px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 16px;
      background: #15151e;
      border: 1px solid #1e1e2e;
      border-radius: 12px;
      min-height: 320px;
      max-height: 55vh;
    }

    .msg {
      display: flex;
      flex-direction: column;
      max-width: 88%;
    }
    .msg.user  { align-self: flex-end; }
    .msg.assistant { align-self: flex-start; }

    .msg .label {
      font-size: 0.7rem;
      color: #475569;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .msg.user .label  { text-align: right; }

    .msg .bubble {
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.93rem;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user .bubble {
      background: #1d4ed8;
      color: #eff6ff;
      border-bottom-right-radius: 3px;
    }
    .msg.assistant .bubble {
      background: #1e293b;
      color: #e2e8f0;
      border-bottom-left-radius: 3px;
    }

    .thinking { color: #64748b; font-size: 0.85rem; padding: 6px 0; }
    .cursor { display: inline-block; width: 8px; height: 15px; background: #7dd3fc; animation: blink .7s step-end infinite; margin-left: 2px; vertical-align: middle; border-radius: 2px; }
    @keyframes blink { 50% { opacity: 0; } }

    .input-row {
      display: flex;
      gap: 8px;
    }

    #userInput {
      flex: 1;
      padding: 12px 14px;
      border: 1px solid #1e293b;
      border-radius: 10px;
      background: #15151e;
      color: #e2e8f0;
      font-size: 0.95rem;
      resize: none;
      outline: none;
      transition: border-color .2s;
    }
    #userInput:focus { border-color: #3b82f6; }
    #userInput::placeholder { color: #475569; }

    button {
      padding: 12px 22px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background .2s, opacity .2s;
      white-space: nowrap;
    }
    button:hover  { background: #1d4ed8; }
    button:disabled { opacity: .45; cursor: not-allowed; }

    #clearBtn {
      background: transparent;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 12px 16px;
    }
    #clearBtn:hover { background: #1e293b; }

    .status-bar {
      margin-top: 8px;
      font-size: 0.75rem;
      color: #475569;
      text-align: center;
    }
    .status-bar span { color: #22d3ee; }
  </style>
</head>
<body>
  <header>
    <h1>LinguaAI Chat</h1>
    <p>Manual Browser Test – Groq Cloud</p>
    <div class="badge">llama-3.3-70b-versatile &nbsp;·&nbsp; Streaming SSE</div>
  </header>

  <div class="chat-window">
    <div id="messages">
      <div class="thinking">Send a message to start chatting with the AI tutor…</div>
    </div>

    <div class="input-row">
      <textarea id="userInput" rows="2" placeholder="Type a message… (Enter to send, Shift+Enter for new line)"></textarea>
      <button id="sendBtn" onclick="sendMessage()">Send</button>
      <button id="clearBtn" onclick="clearChat()">Clear</button>
    </div>

    <div class="status-bar">
      API: <span>http://localhost:8000</span> &nbsp;·&nbsp;
      Model: <span>llama-3.3-70b-versatile</span> &nbsp;·&nbsp;
      Endpoint: <span>POST /ai/chat/stream</span>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:8000';
    const history = [];   // [{role, content}, …]

    const messagesEl = document.getElementById('messages');
    const inputEl    = document.getElementById('userInput');
    const sendBtn    = document.getElementById('sendBtn');

    // Enter to send
    inputEl.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    function addMessage(role, content, streaming = false) {
      const wrap = document.createElement('div');
      wrap.className = `msg ${role}`;

      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = role === 'user' ? 'You' : 'Assistant (Groq)';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = content;

      if (streaming) {
        const cursor = document.createElement('span');
        cursor.className = 'cursor';
        bubble.appendChild(cursor);
      }

      wrap.appendChild(label);
      wrap.appendChild(bubble);
      messagesEl.appendChild(wrap);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return bubble;
    }

    function clearFirstHint() {
      const hint = messagesEl.querySelector('.thinking');
      if (hint) hint.remove();
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text || sendBtn.disabled) return;

      clearFirstHint();
      sendBtn.disabled = true;
      inputEl.value = '';

      // Add user message to UI + history
      addMessage('user', text);
      history.push({ role: 'user', content: text });

      // Prepare assistant bubble
      const bubble = addMessage('assistant', '', true);

      try {
        const response = await fetch(`${API_BASE}/ai/chat/stream`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            messages: history,
            language: 'english',
          }),
        });

        if (!response.ok) {
          const err = await response.text();
          bubble.textContent = `Error ${response.status}: ${err}`;
          history.pop();
          return;
        }

        // Remove cursor initially so we don't duplicate it
        const cursor = bubble.querySelector('.cursor');

        const reader  = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer    = '';
        let fullText  = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });

          let newline;
          while ((newline = buffer.indexOf('\n')) !== -1) {
            const line = buffer.slice(0, newline).trim();
            buffer = buffer.slice(newline + 1);

            if (!line.startsWith('data:')) continue;
            const dataStr = line.slice(5).trim();
            if (dataStr === '[DONE]') break;

            try {
              const obj = JSON.parse(dataStr);
              if (obj.token) {
                fullText += obj.token;
                bubble.textContent = fullText;
                // Re-append cursor
                if (cursor) bubble.appendChild(cursor);
                messagesEl.scrollTop = messagesEl.scrollHeight;
              }
              if (obj.error) {
                bubble.textContent = `AI error: ${obj.error}`;
              }
            } catch { /* ignore parse errors */ }
          }
        }

        // Finalize: remove cursor
        if (cursor) cursor.remove();
        if (!fullText) bubble.textContent = '(no response)';

        history.push({ role: 'assistant', content: fullText });

      } catch (err) {
        bubble.textContent = `Network error: ${err.message}`;
        history.pop();
      } finally {
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    function clearChat() {
      history.length = 0;
      messagesEl.innerHTML = '<div class="thinking">Chat cleared. Send a message to start again…</div>';
    }
  </script>
</body>
</html>
