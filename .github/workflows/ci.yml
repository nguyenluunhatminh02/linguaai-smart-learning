# Minimal CI skeleton (OPS-02). Unit tests only: no real provider keys,
# no service containers, no build-image or deploy jobs.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fake, non-secret values only. Never read real keys or .env files in CI.
  NODE_ENV: test
  APP_ENV: test
  CI: "true"
  DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/linguaai_ci
  JWT_SECRET: ci-only-jwt-secret-not-a-real-key-0123456789
  JWT_REFRESH_SECRET: ci-only-refresh-secret-not-a-real-key-0123456789
  AI_SERVICE_API_KEYS: ci-only-ai-service-key-0123456789
  GROQ_API_KEY: ci-fake-groq-key
  GROQ_MODEL: llama-3.3-70b-versatile
  DEBUG: "false"
  CORS_ORIGINS: http://127.0.0.1:3000
  AI_SERVICE_URL: http://127.0.0.1:8000
  FRONTEND_URL: http://127.0.0.1:3000

jobs:
  checks:
    name: Lint, type-check and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm

      - name: Backup script harness (stubbed tools, fake values only)
        # ops-19/DB-05: exercises the Bash backup/verification/restore-guard/
        # retention logic with PATH stubs. No DB, network, secrets or .env reads.
        run: bash tests/scripts/backup_test.sh

      - name: Verify fake CI environment
        run: |
          test "${APP_ENV}" = test
          test "${NODE_ENV}" = test
          test "${CI}" = true
          test "${DEBUG}" = false
          test "${GROQ_API_KEY}" = ci-fake-groq-key
          test "${AI_SERVICE_API_KEYS}" = ci-only-ai-service-key-0123456789
          test "${DATABASE_URL}" = postgresql://ci:ci@127.0.0.1:5432/linguaai_ci

      - name: Reject tracked .env files
        # Policy §6.1: CI uses workflow env vars only; never a developer .env.
        run: |
          if git ls-files --cached --others --exclude-standard | grep -E '(^|/)\.env$'; then
            echo "::error::Refusing to run with .env files present in the checkout"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter api db:generate

      - name: Type-check API
        run: pnpm --filter api type-check

      - name: Type-check web
        run: pnpm --filter web type-check

      - name: Lint API
        run: pnpm --filter api lint

      - name: Lint web
        run: pnpm --filter web lint

      - name: API unit tests
        # Unit suites assert no AI_SERVICE_API_KEYS is present; unset it for
        # this process while other steps keep the fake value from env above.
        run: env -u AI_SERVICE_API_KEYS pnpm --filter api test -- --runInBand

      - name: Web unit tests
        run: pnpm --filter web test:run

      # OPS-15: benchmark harness unit tests and config smoke only. No load
      # test, no server and no provider calls run in pull-request CI.
      - name: Benchmark harness unit tests
        continue-on-error: true
        run: pnpm benchmark:test

      - name: Benchmark harness dry run
        continue-on-error: true
        run: pnpm benchmark:dry

      - name: Upload JS unit test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-logs
          path: |
            apps/api/coverage/
            apps/web/coverage/
          if-no-files-found: ignore
          retention-days: 7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"
          cache: pip
          cache-dependency-path: apps/ai-service/requirements.txt

      - name: Install AI service test dependencies in a venv
        working-directory: apps/ai-service
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pytest==8.3.4" "pytest-asyncio==0.25.2"
          python -m pip check

      - name: AI service unit tests
        working-directory: apps/ai-service
        run: |
          . .venv/bin/activate
          python -m pytest -q --junitxml=coverage/junit.xml

      - name: Upload AI JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-junit
          path: apps/ai-service/coverage/junit.xml
          if-no-files-found: ignore
          retention-days: 7
